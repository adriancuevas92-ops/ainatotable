name: Deploy site to GitHub Pages

# Deploys on merge to main, as this repo already did. The gate is the PULL
# REQUEST, not this trigger: merging to main publishes ainatotable.com, so the
# review that must happen — messaging and strategy confirmed, and the PACA
# broker question closed with Legal & Ethics (7 U.S.C. §499a(b)(7) has no
# possession and no title element) — happens before the merge button, on the PR.
#
# A branch push does NOT deploy. Only main does.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No requirements.txt: build.py is standard library only, so there is
      # nothing to install. The three CSVs it reads are vendored in data/ —
      # see the comment at the top of build.py for why the mart path outside
      # the repo is not read directly.
      #
      # build.py is a GATE: it refuses to write output on any Gate C violation,
      # including price data older than MAX_PRICE_AGE_DAYS. A stale catalogue
      # therefore fails CI rather than publishing a false claim about today's
      # market. Refresh with tools/refresh_data.py and commit data/.
      - run: python3 -I build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
