<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@700&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
  body { background: #fdf6e8; font-family: Inter, sans-serif; padding: 40px; margin:0; }
  .row { display: flex; gap: 50px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 50px; }
  .item { text-align: center; }
  .item img { display: block; background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(15,61,43,0.12); }
  .item p { color: #56503f; font-size: 13px; margin-top: 10px; }
  .dark { background: #0f3d2b; padding: 20px; border-radius: 12px; }
  h2 { font-family: Noto Serif, serif; color: #0f3d2b; font-size: 18px; }
</style>
</head>
<body>

<h2>Icon mark — favicon / social avatar scale</h2>
<div class="row">
  <div class="item"><img src="mark.svg" width="90" height="90" style="padding:14px"><p>90px, on light</p></div>
  <div class="item"><img src="mark.svg" width="40" height="40" style="padding:8px"><p>40px (favicon size)</p></div>
  <div class="item"><img src="mark-solid.svg" width="90" height="90" style="padding:14px"><p>1-color silhouette<br>(stamp / embroidery)</p></div>
</div>

<h2>Program seal — institutional / large-scale use</h2>
<div class="row">
  <div class="item"><img src="badge.svg" width="220" height="220"><p>220px</p></div>
</div>

<h2>Horizontal lockup — website header / letterhead</h2>
<div class="row">
  <div class="item"><img src="lockup.svg" width="480" height="120" style="padding:16px"><p>on cream</p></div>
</div>

</body>
</html>
